name: Validate Godot project
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        uses: chickensoft/setup-godot-action@v1
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import and validate project
        run: godot --headless --path . --editor --quit
