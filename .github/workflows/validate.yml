name: Validate Godot project
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import, parse and smoke-test game scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-import.log; then
            echo 'Godot reported project or script errors during import.'
            exit 1
          fi
          godot --headless --path . --quit-after 120 2>&1 | tee godot-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-smoke.log; then
            echo 'Godot reported errors while launching the main scene.'
            exit 1
          fi
