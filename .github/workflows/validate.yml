name: Validate Godot project
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import and validate project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-validation.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-validation.log; then
            echo 'Godot reported script or project errors.'
            exit 1
          fi
